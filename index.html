<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💗 I Love You 💗</title>
    <style>
        /* General page layout settings */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #pinkboard {
            z-index: 1;
        }

        #canvas {
            z-index: 2;
            pointer-events: auto;  /* Allows clicks to pass through text canvas */
            cursor:grab;
            touch-action: none;
        }

        #canvas:active {
            cursor: grabbing;
        }

    </style>
</head>
<body>

    <!-- Background music audio element -->
    <audio autoplay loop id="bg-music">
        <source src="in-the-shadow-of-the-sun.mp3" type="audio/mpeg">
    </audio>

    <!-- Canvases for animations -->
    <!-- <canvas id="pinkboard"></canvas> -->
    <canvas id="canvas"></canvas>

    <!-- External JavaScript file reference -->
    <script src="script.js"></script>
</body>
</html>
